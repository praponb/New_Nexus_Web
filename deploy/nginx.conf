# Nexus frontend container. TLS is terminated by Cloudflare, so requests arrive here over plain
# HTTP from the host's cloudflared; X-Forwarded-Proto is forced to https for Django.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects (e.g. /auth/login → /auth/login/): nginx itself only sees http, so an
    # absolute Location would send the browser to http:// instead of https://.
    absolute_redirect off;

    # Resolve `web` through Docker's DNS at request time: a restarted web container gets a new IP,
    # and a static `proxy_pass http://web:8000` would keep the old one (502 until nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://web:8000;

    # Requirement uploads are capped at 5 MB by the API.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass $backend;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass $backend;
    }

    # Live run logs; a generation can last up to 90 minutes.
    location /ws/ {
        proxy_pass $backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Django admin assets (collectstatic writes into the shared `static` volume).
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
